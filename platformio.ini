; DOMOSOLUCES prototype firmware - no production secrets here
[env:keyestudio-esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0
build_flags =
  -D DOMO_FIRMWARE_VERSION=\"0.1.0-dev\"
  -D DOMO_RELAY_PIN=26
