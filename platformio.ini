; DOMOSOLUCES prototype firmware - no production secrets here
[env:keyestudio-esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.0
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
  -D DOMO_FIRMWARE_VERSION=\"0.1.0-dev\"
